<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#FF2A85"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <filter id="cr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0A0C10"/>
  <circle cx="32" cy="32" r="28" stroke="url(#cr-grad)" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Reverb sound waves -->
  <path d="M12 32 C 16 20, 20 44, 24 32 C 28 14, 32 50, 36 32 C 40 18, 44 46, 48 32 C 50 26, 52 38, 54 32" 
        stroke="url(#cr-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cr-glow)"/>
  <!-- Center vinyl hole -->
  <circle cx="32" cy="32" r="4.5" fill="#0A0C10" stroke="#FF2A85" stroke-width="2"/>
</svg>
